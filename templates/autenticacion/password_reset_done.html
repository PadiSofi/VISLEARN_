{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card" style="text-align:center;">
        <span class="material-symbols-outlined" style="font-size:48px; color:var(--color-primary);">mark_email_read</span>
        <h1 class="auth-card__title">Revisa tu correo</h1>
        <p class="auth-card__subtitle">Si el correo existe en nuestro sistema, te llegará un enlace para restablecer tu contraseña.</p>
        <p class="auth-footer-text"><a href="{% url 'usuarios:login' %}">Volver a iniciar sesión</a></p>
    </div>
</div>
{% endblock %}
