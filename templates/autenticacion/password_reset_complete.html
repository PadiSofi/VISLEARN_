{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card" style="text-align:center;">
        <span class="material-symbols-outlined" style="font-size:48px; color:var(--color-primary);">check_circle</span>
        <h1 class="auth-card__title">¡Contraseña Actualizada!</h1>
        <p class="auth-card__subtitle">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a href="{% url 'usuarios:login' %}" class="btn-auth-submit" style="display:block; text-align:center; text-decoration:none; margin-top:16px;">Iniciar Sesión</a>
    </div>
</div>
{% endblock %}
