{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/auth.css' %}">{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card__header">
            <h1 class="auth-card__title">Recuperar Contraseña</h1>
            <p class="auth-card__subtitle">Ingresa tu correo y te enviaremos instrucciones para restablecerla.</p>
        </div>
        <form class="auth-form" method="post">
            {% csrf_token %}
            <div class="auth-field">
                <label class="auth-label">Correo electrónico</label>
                <input type="email" name="email" class="auth-input" required>
            </div>
            <button class="btn-auth-submit" type="submit">Enviar Instrucciones</button>
        </form>
        <p class="auth-footer-text"><a href="{% url 'usuarios:login' %}">Volver a iniciar sesión</a></p>
    </div>
</div>
{% endblock %}
